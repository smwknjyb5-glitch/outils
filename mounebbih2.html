   <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منبه</title>

<style>

body{
    margin:0;
    background:#eef6ff;
    font-family:Tahoma;
    text-align:center;
}

.container{
    width:420px;
    max-width:95%;
    margin:40px auto;
    background:white;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
    padding:25px;
}

h1{
    color:#0066cc;
}

#clock{
    font-size:60px;
    color:#d35400;
    margin:25px 0;
    font-weight:bold;
}

input[type=time]{
    font-size:25px;
    padding:8px;
}

button{
    padding:12px 25px;
    margin:10px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#setBtn{
    background:#28a745;
    color:white;
}

#stopBtn{
    background:#dc3545;
    color:white;
}

#testBtn{
    background:#007bff;
    color:white;
}

#status{
    margin-top:20px;
    font-size:22px;
    color:#006600;
    min-height:30px;
}

</style>
</head>

<body>

<div class="container">

<h1>⏰  منبه بنغمة  </h1>

<div id="clock">00:00:00</div>

<input type="time" id="alarmTime">

<br>

<button id="setBtn" onclick="setAlarm()">
ضبط المنبه
</button>

<button id="stopBtn" onclick="stopAlarm()">
إيقاف
</button>

<button id="testBtn" onclick="testSound()">
اختبار الصوت
</button>

<div id="status"></div>

<audio id="alarmSound" loop>
    <source src="alarm2.mp3" type="audio/mpeg">
</audio>

<script>

let alarmTime="";
let ringing=false;

function updateClock(){

    let now=new Date();

    let h=String(now.getHours()).padStart(2,"0");
    let m=String(now.getMinutes()).padStart(2,"0");
    let s=String(now.getSeconds()).padStart(2,"0");

    document.getElementById("clock").innerHTML=
        h+":"+m+":"+s;

    if(alarmTime!="" &&
       h+":"+m===alarmTime &&
       !ringing){

        ringing=true;

        let audio=document.getElementById("alarmSound");

        audio.currentTime=0;

        audio.loop=true;

        audio.play();

        document.getElementById("status").innerHTML=
        "🔔 حان وقت المنبه";
    }

}
 setInterval(updateClock,1000);

function setAlarm(){

    alarmTime=document.getElementById("alarmTime").value;

    if(alarmTime==""){
        alert("اختر وقت المنبه أولاً");
        return;
    }

    document.getElementById("status").innerHTML=
    "✅ تم ضبط المنبه على " + alarmTime;

}

function stopAlarm(){

    ringing=false;

    let audio=document.getElementById("alarmSound");

    audio.pause();

    audio.currentTime=0;

    document.getElementById("status").innerHTML=
    "⏹️ تم إيقاف المنبه";

}

function testSound(){

    let audio=document.getElementById("alarmSound");

    audio.pause();

    audio.currentTime=0;

    audio.loop=false;

    audio.play();

}

</script>

</div>

</body>
</html>
